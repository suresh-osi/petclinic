name: Build and Deploy to AWS EC2

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  AWS_REGION: ap-south-1
  JAVA_VERSION: '17'
  TF_DIR: infrastructure/environments/dev

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: Build & Test
  # -----------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'adopt'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven (skip tests for speed, run verify)
        run: ./mvnw -B verify --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-jar
          path: target/spring-petclinic-*.jar
          retention-days: 7

  # -----------------------------------------------------------------------
  # JOB 2: Deploy Infrastructure via Terraform
  # Only runs on push to main (not on PRs)
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to AWS (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: terraform init -upgrade

      - name: Import drifted IAM resources (idempotent)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: |
          # Import IAM policy if it exists in AWS but not in state
          POLICY_ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='NewRelic-CloudWatch-Integration-Policy'].Arn" --output text)
          if [ -n "$POLICY_ARN" ]; then
            echo "Importing NewRelic-CloudWatch-Integration-Policy → $POLICY_ARN"
            terraform import aws_iam_policy.newrelic_cloudwatch_policy "$POLICY_ARN" || echo "Already in state, skipping."
          fi

          # Import IAM role if it exists in AWS but not in state
          ROLE_EXISTS=$(aws iam get-role --role-name NewRelic-LogForwarder-Lambda-Role --query "Role.RoleName" --output text 2>/dev/null || echo "")
          if [ -n "$ROLE_EXISTS" ]; then
            echo "Importing NewRelic-LogForwarder-Lambda-Role"
            terraform import aws_iam_role.newrelic_lambda_role NewRelic-LogForwarder-Lambda-Role || echo "Already in state, skipping."
          fi

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: terraform plan -out=tfplan.out

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: terraform apply -auto-approve tfplan.out

      - name: Get ALB DNS name
        id: alb
        working-directory: ${{ env.TF_DIR }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns)
          echo "dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"
          echo "ALB endpoint: http://${ALB_DNS}"

      - name: Wait for application to become healthy
        run: |
          ALB_DNS="${{ steps.alb.outputs.dns }}"
          echo "Polling http://${ALB_DNS}/ — up to 10 minutes..."
          for i in $(seq 1 60); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ALB_DNS}/" 2>/dev/null || echo "000")
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "✅ Application healthy — HTTP ${HTTP_STATUS} (attempt ${i}/60)"
              exit 0
            fi
            echo "  attempt ${i}/60 — HTTP ${HTTP_STATUS}, waiting 10s..."
            sleep 10
          done
          echo "❌ Application did not return HTTP 200 after 10 minutes"
          exit 1

      - name: Print deployment summary
        if: success()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ALB Endpoint | http://${{ steps.alb.outputs.dns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------------
  # JOB 3: PR-only Terraform Plan (no apply)
  # -----------------------------------------------------------------------
  plan:
    name: Terraform Plan (PR preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    environment: dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan for \`dev\` 🔍

            Triggered by: @${{ github.actor }}
            Commit: \`${{ github.sha }}\`

            > ℹ️ This is a **plan-only** preview. Changes will be applied when the PR is merged to \`main\`.
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
