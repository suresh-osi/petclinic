name: Build and Deploy to AWS EC2

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  AWS_REGION: ap-south-1
  JAVA_VERSION: '17'
  TF_DIR: infrastructure/environments/dev

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: Build & Test
  # -----------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'adopt'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven (skip tests for speed, run verify)
        run: ./mvnw -B verify --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-jar
          path: target/spring-petclinic-*.jar
          retention-days: 7

  # -----------------------------------------------------------------------
  # JOB 2: Deploy Infrastructure via Terraform
  # Only runs on push to main (not on PRs)
  # -----------------------------------------------------------------------
  deploy:
    name: Deploy to AWS (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: terraform init -upgrade -reconfigure

      - name: Import all drifted AWS resources into Terraform state (idempotent)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: |
          import_if_missing() {
            local resource="$1"
            local id="$2"
            if terraform state show "$resource" > /dev/null 2>&1; then
              echo "✅ $resource already in state, skipping."
            else
              echo "⬇️  Importing $resource → $id"
              terraform import "$resource" "$id" && echo "✅ Imported $resource" || echo "⚠️  Import failed for $resource"
            fi
          }

          # --- VPC ---
          import_if_missing "aws_vpc.main" "vpc-0f6d587e89c49eab6"

          # --- Subnets ---
          import_if_missing "aws_subnet.public_1" "subnet-0068b88453b5bd14f"
          import_if_missing "aws_subnet.public_2" "subnet-06adc71dc4b6d567d"

          # --- Internet Gateway ---
          import_if_missing "aws_internet_gateway.igw" "igw-009921ea27a049433"

          # --- Route Table ---
          import_if_missing "aws_route_table.public" "rtb-0f4a91be33ebc5c01"

          # --- Route Table Associations ---
          import_if_missing "aws_route_table_association.a1" "rtbassoc-09a669d87e96dfdcf"
          import_if_missing "aws_route_table_association.a2" "rtbassoc-0f75e245be5dbf823"

          # --- Security Groups ---
          import_if_missing "aws_security_group.alb_sg" "sg-0b2b8cb38458f3f49"
          import_if_missing "aws_security_group.ec2_sg" "sg-0fc2ee50aa5187e06"

          # --- ALB ---
          import_if_missing "aws_lb.alb" "arn:aws:elasticloadbalancing:ap-south-1:633426742056:loadbalancer/app/petclinic-alb/11485c59e665a9d2"

          # --- Target Group ---
          import_if_missing "aws_lb_target_group.tg" "arn:aws:elasticloadbalancing:ap-south-1:633426742056:targetgroup/petclinic-tg/580edb451b006e05"

          # --- ALB Listener ---
          import_if_missing "aws_lb_listener.listener" "arn:aws:elasticloadbalancing:ap-south-1:633426742056:listener/app/petclinic-alb/11485c59e665a9d2/95f471895849af84"

          # --- IAM Role: CloudWatch Agent (EC2) ---
          import_if_missing "aws_iam_role.cloudwatch_agent_role" "petclinic-server-cloudwatch-agent-role"

          # --- IAM Instance Profile ---
          import_if_missing "aws_iam_instance_profile.cloudwatch_agent_profile" "petclinic-server-cloudwatch-agent-profile"

          # --- IAM Role: NewRelic CloudWatch Integration ---
          import_if_missing "aws_iam_role.newrelic_cloudwatch_role" "NewRelic-CloudWatch-Integration-Role"

          # --- IAM Policy: NewRelic CloudWatch ---
          POLICY_ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='NewRelic-CloudWatch-Integration-Policy'].Arn" --output text 2>/dev/null || echo "")
          [ -n "$POLICY_ARN" ] && import_if_missing "aws_iam_policy.newrelic_cloudwatch_policy" "$POLICY_ARN"

          # --- IAM Role: NewRelic Lambda ---
          import_if_missing "aws_iam_role.newrelic_lambda_role" "NewRelic-LogForwarder-Lambda-Role"

          # --- Lambda Function ---
          import_if_missing "aws_lambda_function.newrelic_log_forwarder" "NewRelic-PetClinic-LogForwarder"

          # --- EC2 Instance ---
          import_if_missing "aws_instance.petclinic" "i-026ef89c4cb6fed01"

          # --- CloudWatch Log Groups ---
          import_if_missing "aws_cloudwatch_log_group.petclinic_app"           "petclinic/application-logs"
          import_if_missing "aws_cloudwatch_log_group.petclinic_apache_access" "petclinic/apache-access-logs"
          import_if_missing "aws_cloudwatch_log_group.petclinic_apache_error"  "petclinic/apache-error-logs"
          import_if_missing "aws_cloudwatch_log_group.petclinic_userdata"      "petclinic/userdata-logs"

          echo "--- Import phase complete ---"

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: terraform plan -out=tfplan.out

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_newrelic_license_key: ${{ secrets.TF_VAR_NEWRELIC_LICENSE_KEY }}
          TF_VAR_newrelic_external_id: ${{ secrets.TF_VAR_NEWRELIC_EXTERNAL_ID }}
        run: terraform apply -auto-approve tfplan.out

      - name: Get ALB DNS name
        id: alb
        working-directory: ${{ env.TF_DIR }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns)
          echo "dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"
          echo "ALB endpoint: http://${ALB_DNS}"

      - name: Wait for application to become healthy
        run: |
          ALB_DNS="${{ steps.alb.outputs.dns }}"
          echo "Polling http://${ALB_DNS}/ — up to 10 minutes..."
          for i in $(seq 1 60); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ALB_DNS}/" 2>/dev/null || echo "000")
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "✅ Application healthy — HTTP ${HTTP_STATUS} (attempt ${i}/60)"
              exit 0
            fi
            echo "  attempt ${i}/60 — HTTP ${HTTP_STATUS}, waiting 10s..."
            sleep 10
          done
          echo "❌ Application did not return HTTP 200 after 10 minutes"
          exit 1

      - name: Print deployment summary
        if: success()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ALB Endpoint | http://${{ steps.alb.outputs.dns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------------------
  # JOB 3: PR-only Terraform Plan (no apply)
  # -----------------------------------------------------------------------
  plan:
    name: Terraform Plan (PR preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    environment: dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -upgrade

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan for \`dev\` 🔍

            Triggered by: @${{ github.actor }}
            Commit: \`${{ github.sha }}\`

            > ℹ️ This is a **plan-only** preview. Changes will be applied when the PR is merged to \`main\`.
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
